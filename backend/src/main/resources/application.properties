# --- Database ---
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:/tmp/urlshortenerdb;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:${MYSQLUSER:sa}}
spring.datasource.password=${DATABASE_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DATABASE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=${FLYWAY_ENABLED:true}

