# --- Database ---
spring.datasource.url=${DATABASE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:urlshortenerdb}}
spring.datasource.username=${DATABASE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DATABASE_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=${DATABASE_DIALECT:org.hibernate.dialect.MySQL8Dialect}
spring.jpa.hibernate.ddl-auto=update

# --- App Settings ---
jwt.secret=${JWT_SECRET:change-this-secret-before-deploying}
jwt.expiration=${JWT_EXPIRATION:86400000}
frontend.url=${FRONTEND_URL:http://localhost:5173}
server.port=${PORT:8080}
