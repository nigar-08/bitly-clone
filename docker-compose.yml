services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shortener
      MYSQL_USER: shortener
      MYSQL_PASSWORD: shortener
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      MYSQLHOST: mysql
      MYSQLPORT: 3306
      MYSQLDATABASE: shortener
      MYSQLUSER: shortener
      MYSQLPASSWORD: shortener
      JWT_SECRET: ZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LXdpdGgtMzItYnl0ZXM=
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
